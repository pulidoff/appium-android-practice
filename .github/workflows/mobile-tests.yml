name: Dependency Install Check

# This project's Appium/UiAutomator2 tests require a real Android emulator
# and a running Appium server, so they only run locally (see the "Running
# the tests" section in README.md). This workflow just verifies that the
# project's dependencies install cleanly on every push/PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci
