name: Mobile Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-tests:
    # macos-latest currently resolves to an Apple Silicon (arm64) image, which
    # cannot hardware-accelerate an x86_64 emulator and reliably times out on
    # boot. Pin to the Intel-based image so the x86_64 AVD gets Hypervisor
    # Framework acceleration.
    runs-on: macos-13
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Appium UiAutomator2 driver
        run: npx appium driver install uiautomator2

      - name: Download WebdriverIO Native Demo App APK
        run: |
          mkdir -p apps
          curl -L -o apps/wdio-native-demo-app.apk \
            https://github.com/webdriverio/native-demo-app/releases/latest/download/Android-NativeDemoApp-Release.apk

      - name: Cache Android AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-33-google_apis-x86_64-v1

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          avd-name: Pixel_7_Pro
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created, snapshot cached."

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          avd-name: Pixel_7_Pro
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: npm test
        env:
          APP_PATH: ${{ github.workspace }}/apps/wdio-native-demo-app.apk
