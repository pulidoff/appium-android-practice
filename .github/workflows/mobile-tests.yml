name: Mobile Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-tests:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Appium UiAutomator2 driver
        run: npx appium driver install uiautomator2

      - name: Download WebdriverIO Native Demo App APK
        run: |
          mkdir -p apps
          curl -L -o apps/wdio-native-demo-app.apk \
            https://github.com/webdriverio/native-demo-app/releases/latest/download/Android-NativeDemoApp-Release.apk

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          avd-name: Pixel_7_Pro
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: npm test
        env:
          APP_PATH: ${{ github.workspace }}/apps/wdio-native-demo-app.apk
